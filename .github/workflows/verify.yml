name: component-checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
      - run: python -m pip install -e ".[dev,persistence]"
      - run: python -m pip check
      - run: python scripts/release_check.py
      - run: python -m pytest -q
      - run: python scripts/verify_local_server.py
      - run: python -m build
      - run: python scripts/verify_wheel.py dist/*.whl
      - run: python examples/demo.py --output artifacts/demo.json
